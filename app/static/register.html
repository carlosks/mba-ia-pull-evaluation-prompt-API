<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBA IA - Criar Conta</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h1>MBA IA</h1>
      <h2>Criar conta</h2>

      <p class="muted">
        Crie sua conta para acessar o dashboard e gerar soluções técnicas a partir de bugs.
      </p>

      <form id="registerForm">
        <label for="registerEmail">E-mail</label>
        <input id="registerEmail" type="email" placeholder="seu-email@exemplo.com" required />

        <label for="registerPassword">Senha</label>
        <input id="registerPassword" type="password" placeholder="Mínimo de 8 caracteres" minlength="8" required />

        <label for="registerPasswordConfirm">Confirmar senha</label>
        <input id="registerPasswordConfirm" type="password" placeholder="Confirme a senha" required />

        <label class="checkbox-line" for="registerAcceptTerms">
          <input id="registerAcceptTerms" type="checkbox" required />
          <span>
            Li e aceito os <a href="/static/termos.html" target="_blank" rel="noopener">Termos de Uso</a>
            e a <a href="/static/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.
          </span>
        </label>

        <button type="submit">Criar conta</button>
      </form>

      <p id="registerMessage" class="message"></p>

      <p class="muted small">
        Já tem conta? <a href="/static/login.html">Entrar</a>
      </p>

      <p class="auth-legal-links">
        <a href="/static/index.html">Página inicial</a> ·
        <a href="/static/termos.html">Termos</a> ·
        <a href="/static/privacidade.html">Privacidade</a>
      </p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
