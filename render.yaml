services:
  - type: web
    name: bug-to-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    # --proxy-headers faz o limite por IP enxergar o IP real do cliente atrás do proxy do Render.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000 --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CREATE_DEV_ADMIN
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JOB_WORKERS
        value: "2"
      # Armazenamento durável dos projetos (ex.: Cloudflare R2).
      # Sem ele, os projetos gerados somem a cada deploy.
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Cobrança (Asaas). Sandbox: https://api-sandbox.asaas.com/v3
      - key: ASAAS_BASE_URL
        value: https://api-sandbox.asaas.com/v3
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        generateValue: true
